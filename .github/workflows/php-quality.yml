name: PHP syntax
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring
      - name: Lint PHP files
        run: |
          set -eu
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -r -n1 php -l
